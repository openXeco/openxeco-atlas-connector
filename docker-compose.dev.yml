services:
  frontend:
#    container_name: ${FRONTEND_CONTAINER_NAME:-frontend-dev}
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: development
    expose:
      - "3000"
    environment:
      - NODE_ENV=development
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL}
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
#    container_name: ${BACKEND_CONTAINER_NAME:-backend-dev}
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    # no need to expose at this stage
    #expose:
    #  - "3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - ATLAS_BASE_URL=${ATLAS_BASE_URL}
      - ATLAS_API_KEY=${ATLAS_API_KEY:-}
      - ATLAS_USERNAME=${ATLAS_USERNAME:-}
      - ATLAS_PASSWORD=${ATLAS_PASSWORD:-}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
#    container_name: ${DB_CONTAINER_NAME:-db-dev}
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-atlas_connector}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-atlas_connector}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
#    container_name: ${REDIS_CONTAINER_NAME:-redis-dev}
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
