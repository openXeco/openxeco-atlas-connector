services:
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./packages/frontend:/app/packages/frontend
      - /app/packages/frontend/node_modules
      - /app/packages/frontend/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL}
    depends_on:
      - backend
    networks:
      - atlas-network

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    ports:
      - "3001:3001"
    volumes:
      - ./packages/backend:/app/packages/backend
      - /app/packages/backend/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/atlas_connector
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_EXPIRES_IN=7d
      - ATLAS_BASE_URL=${ATLAS_BASE_URL:-https://dg-cnect-cybersecurity-atlas.acc.dhs.tech.ec.europa.eu/jsonapi}
      - ATLAS_API_KEY=${ATLAS_API_KEY:-}
      - ATLAS_USERNAME=${ATLAS_USERNAME:-}
      - ATLAS_PASSWORD=${ATLAS_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - atlas-network

  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=atlas_connector
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas_connector"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - atlas-network

volumes:
  postgres_data:

networks:
  atlas-network:
    driver: bridge
